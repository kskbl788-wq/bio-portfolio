<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>单摆仿真 · 简谐振动 | 康铭熙</title>
<style>
  :root{
    --bg:#1a1a24;
    --cyan:#22d3ee;
    --dim:#7c8aa5;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;}
  body{
    background:var(--bg);
    overflow:hidden;
    font-family:ui-monospace,"SFMono-Regular",Consolas,"Cascadia Mono",monospace;
    color:#cfe6f5;
  }
  canvas{display:block;}

  .hud{
    position:fixed;top:20px;left:20px;
    padding:14px 18px;
    background:rgba(20,22,34,.72);
    border:1px solid rgba(34,211,238,.22);
    border-radius:10px;
    font-size:13px;
    line-height:1.95;
    letter-spacing:.3px;
    user-select:none;
    pointer-events:none;
  }
  .hud h1{
    font-size:11.5px;font-weight:600;letter-spacing:1.8px;
    color:var(--cyan);margin-bottom:9px;text-transform:uppercase;
  }
  .hud .row{display:flex;justify-content:space-between;gap:26px;}
  .hud .k{color:var(--dim);}
  .hud .v{color:#e8f6ff;font-variant-numeric:tabular-nums;}

  .tag{
    position:fixed;bottom:18px;left:20px;
    font-size:11.5px;color:#5d6a80;letter-spacing:.5px;
    user-select:none;pointer-events:none;
  }
</style>
</head>
<body>

<canvas id="stage"></canvas>

<div class="hud">
  <h1>Pendulum / 单摆仿真</h1>
  <div class="row"><span class="k">摆角 θ</span><span class="v" id="m-theta">–</span></div>
  <div class="row"><span class="k">角速度 ω</span><span class="v" id="m-omega">–</span></div>
  <div class="row"><span class="k">摆长 L</span><span class="v" id="m-len">–</span></div>
  <div class="row"><span class="k">理论周期 T</span><span class="v" id="m-period">–</span></div>
  <div class="row"><span class="k">总能量 E</span><span class="v" id="m-energy">–</span></div>
</div>

<div class="tag">南昌大学 · 生物工程 · 康铭熙 · 7904126009</div>

<script>
(function () {
  'use strict';

  var canvas = document.getElementById('stage');
  var ctx = canvas.getContext('2d');

  /* ---------- 物理参数 ---------- */
  var L_PX     = 200;             // 摆长（像素）
  var G        = 9.8;             // 重力加速度 m/s²
  var THETA0   = Math.PI / 4;     // 初始摆角 45°
  var PX_PER_M = 100;             // 比例尺：100px 记作 1 米

  // L_PX 是像素、G 是 m/s²，量纲不同不能直接相除。
  // 先用比例尺把摆长换算成米（200px → 2.00m），
  // 角加速度 α = -(g/L)·sinθ 才有物理意义，摆动周期也才接近真实单摆（约 2.8 秒）。
  var L_M       = L_PX / PX_PER_M;
  var OMEGA_SQ  = G / L_M;        // (g/L)
  var BOB_R     = 16;             // 摆球半径（像素）

  /* ---------- 状态 ---------- */
  var theta = THETA0;
  var omega = 0;
  var trail = [];
  var TRAIL_MAX = 120;

  /* ---------- 画布尺寸 ---------- */
  var W = 0, H = 0, pivotX = 0, pivotY = 0;
  var dpr = 1;

  function resize() {
    dpr = window.devicePixelRatio || 1;
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width  = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    canvas.style.width  = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    pivotX = W / 2;
    // 让摆球在窗口内始终有落脚空间
    pivotY = Math.max(70, Math.min(H * 0.26, H - L_PX - BOB_R - 60));
    trail.length = 0;   // 尺寸变了，旧轨迹作废
  }

  /* ---------- 物理：RK4 积分 ---------- */
  // 运动方程 θ'' = -(g/L)·sinθ（不做小角度近似，保留真实非线性）
  function angularAccel(th) {
    return -OMEGA_SQ * Math.sin(th);
  }

  function stepRK4(h) {
    var k1x = omega,                    k1v = angularAccel(theta);
    var k2x = omega + 0.5 * h * k1v,    k2v = angularAccel(theta + 0.5 * h * k1x);
    var k3x = omega + 0.5 * h * k2v,    k3v = angularAccel(theta + 0.5 * h * k2x);
    var k4x = omega + h * k3v,          k4v = angularAccel(theta + h * k3x);

    theta += (h / 6) * (k1x + 2 * k2x + 2 * k3x + k4x);
    omega += (h / 6) * (k1v + 2 * k2v + 2 * k3v + k4v);
  }

  /* ---------- 绘图 ---------- */
  function bobPosition() {
    return {
      x: pivotX + L_PX * Math.sin(theta),
      y: pivotY + L_PX * Math.cos(theta)
    };
  }

  function drawBackground() {
    ctx.fillStyle = '#1a1a24';
    ctx.fillRect(0, 0, W, H);

    var halo = ctx.createRadialGradient(pivotX, pivotY, 0, pivotX, pivotY, Math.max(W, H) * 0.75);
    halo.addColorStop(0, 'rgba(34,211,238,0.07)');
    halo.addColorStop(1, 'rgba(26,26,36,0)');
    ctx.fillStyle = halo;
    ctx.fillRect(0, 0, W, H);
  }

  function drawSwingArc() {
    var amp = Math.max(Math.abs(THETA0), Math.abs(theta));
    ctx.save();
    ctx.strokeStyle = 'rgba(124,138,165,0.18)';
    ctx.lineWidth = 1;
    ctx.setLineDash([3, 7]);
    ctx.beginPath();
    ctx.arc(pivotX, pivotY, L_PX, Math.PI / 2 - amp, Math.PI / 2 + amp);
    ctx.stroke();
    ctx.restore();
  }

  function drawTrail() {
    if (trail.length < 2) return;
    ctx.save();
    ctx.lineCap = 'round';
    for (var i = 1; i < trail.length; i++) {
      var t = i / trail.length;              // 越新越亮
      ctx.beginPath();
      ctx.moveTo(trail[i - 1].x, trail[i - 1].y);
      ctx.lineTo(trail[i].x, trail[i].y);
      ctx.strokeStyle = 'rgba(34,211,238,' + (t * t * 0.55).toFixed(3) + ')';
      ctx.lineWidth = 0.6 + t * 2.2;
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawRig(bob) {
    // 悬杆
    var rod = ctx.createLinearGradient(pivotX, pivotY, bob.x, bob.y);
    rod.addColorStop(0, 'rgba(180,200,225,0.30)');
    rod.addColorStop(1, 'rgba(180,200,225,0.68)');
    ctx.strokeStyle = rod;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(pivotX, pivotY);
    ctx.lineTo(bob.x, bob.y);
    ctx.stroke();

    // 悬点
    ctx.fillStyle = '#8fa6c4';
    ctx.beginPath();
    ctx.arc(pivotX, pivotY, 5, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = 'rgba(34,211,238,0.5)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(pivotX, pivotY, 9, 0, Math.PI * 2);
    ctx.stroke();
  }

  function drawBob(bob) {
    ctx.save();

    // 外层弥散光晕
    ctx.globalCompositeOperation = 'lighter';
    var glow = ctx.createRadialGradient(bob.x, bob.y, BOB_R * 0.4, bob.x, bob.y, BOB_R * 5);
    glow.addColorStop(0, 'rgba(34,211,238,0.40)');
    glow.addColorStop(0.45, 'rgba(34,211,238,0.12)');
    glow.addColorStop(1, 'rgba(34,211,238,0)');
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(bob.x, bob.y, BOB_R * 5, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    // 球体本体
    ctx.save();
    ctx.shadowBlur = 26;
    ctx.shadowColor = 'rgba(34,211,238,0.95)';
    var body = ctx.createRadialGradient(
      bob.x - BOB_R * 0.35, bob.y - BOB_R * 0.35, BOB_R * 0.15,
      bob.x, bob.y, BOB_R
    );
    body.addColorStop(0, '#eafcff');
    body.addColorStop(0.35, '#7ee7fb');
    body.addColorStop(1, '#0e7490');
    ctx.fillStyle = body;
    ctx.beginPath();
    ctx.arc(bob.x, bob.y, BOB_R, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    // 高光点
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    ctx.beginPath();
    ctx.arc(bob.x - BOB_R * 0.34, bob.y - BOB_R * 0.36, BOB_R * 0.22, 0, Math.PI * 2);
    ctx.fill();
  }

  function render() {
    var bob = bobPosition();

    trail.push({ x: bob.x, y: bob.y });
    if (trail.length > TRAIL_MAX) trail.shift();

    drawBackground();
    drawSwingArc();
    drawTrail();
    drawRig(bob);
    drawBob(bob);
  }

  /* ---------- HUD ---------- */
  var els = {
    theta:  document.getElementById('m-theta'),
    omega:  document.getElementById('m-omega'),
    len:    document.getElementById('m-len'),
    period: document.getElementById('m-period'),
    energy: document.getElementById('m-energy')
  };
  var T0 = 2 * Math.PI * Math.sqrt(L_M / G);
  var hudTick = 0;

  function updateHUD() {
    if (hudTick++ % 4 !== 0) return;   // 约每 4 帧刷新一次，避免频繁重排

    var deg = theta * 180 / Math.PI;
    // 能量按 m = 1 kg 计算：E = g·L·(1-cosθ) + ½·(L·ω)²
    var energy = G * L_M * (1 - Math.cos(theta)) + 0.5 * Math.pow(L_M * omega, 2);

    els.theta.textContent  = (deg >= 0 ? '+' : '') + deg.toFixed(2) + '°';
    els.omega.textContent  = (omega >= 0 ? '+' : '') + omega.toFixed(3) + ' rad/s';
    els.len.textContent    = L_PX + ' px  (' + L_M.toFixed(2) + ' m)';
    els.period.textContent = T0.toFixed(3) + ' s';
    els.energy.textContent = energy.toFixed(4) + ' J';
  }

  /* ---------- 主循环 ---------- */
  var FIXED_DT = 1 / 240;   // 固定步长，保证不同刷新率下物理表现一致
  var last = performance.now();
  var acc = 0;

  function loop(now) {
    var frameDt = (now - last) / 1000;
    last = now;
    if (frameDt > 0.1) frameDt = 0.1;    // 切走标签页再回来时，防止一次性跳算

    acc += frameDt;
    while (acc >= FIXED_DT) {
      stepRK4(FIXED_DT);
      acc -= FIXED_DT;
    }

    render();
    updateHUD();
    requestAnimationFrame(loop);
  }

  window.addEventListener('resize', resize);
  resize();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
